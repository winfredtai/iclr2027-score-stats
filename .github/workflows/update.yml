name: Update data & deploy site

on:
  # Manual trigger: Actions tab -> "Update data & deploy site" -> Run workflow,
  # or from a terminal: gh workflow run update.yml
  workflow_dispatch:
    inputs:
      refresh:
        description: "Fetch fresh scores from OpenReview before deploying"
        type: boolean
        default: true
  # Redeploy whenever the site or data changes on main (e.g. after a local scripts/update.sh).
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch scores from OpenReview
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: python scripts/fetch.py
      - name: Build stats
        run: python scripts/build.py
      - name: Keep raw snapshot as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-snapshot
          path: data/raw/latest.json
          retention-days: 30
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          ASOF=$(python -c 'import json;print(json.load(open("docs/data/stats.json"))["as_of_et"])')
          git commit -m "Update data (as of ${ASOF})"
          git pull --rebase
          git push

  deploy:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
